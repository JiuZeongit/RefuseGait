data_cfg:
  dataset_name: HNU-Gait
  dataset_root_train: ./db/HNU-Gait/light
  dataset_root_eval: ./db/HNU-Gait/light
  dataset_partition: ./datasets/HNU-Gait/HNU-Gait.json
  num_workers: 6
  data_in_use:
  - true
  - true
  - false
  - false
  - false
  - false
  remove_no_gallery: false
  cache: false
  test_dataset_name: HNU-Gait
evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 40000
  save_name: m1_phasepool_davis346_day40k
  sampler:
    dropout: 0.0
    batch_shuffle: false
    batch_size: 2
    sample_type: all_ordered
    frames_all_limit: 200
  metric: euc
  transform:
  - type: NoOperation
  - type: NoOperation
loss_cfg:
- loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
- loss_term_weight: 1.0
  scale: 16
  type: CrossEntropyLoss
  log_prefix: softmax
  log_accuracy: true
model_cfg:
  model: EDINOv2_Gait
  train_edino: true
  pretrained_edinov2: ./pretrained/Edino.pt
  image_size: 224
  sils_size: 32
  in_channel: 8
  EventEncoder:
    use_event_modality_prompts: true
    num_event_modality_prompts: 256
  Appearance_Branch:
    source_dim: 1536
    target_dim: 16
    p: 0
    softmax: false
    Relu: false
    Up: false
  Action_Branch:
    source_dim: 8
    target_dim: 16
    p: 0
    softmax: false
    Relu: false
    Up: false
  AttentionFusion:
    in_channels: 64
    squeeze_ratio: 16
    feat_len: 2
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    in_channel: 1
    channels:
    - 64
    - 128
    - 256
    - 512
    layers:
    - 1
    - 1
    - 1
    - 1
    strides:
    - 1
    - 2
    - 2
    - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 31
    in_channels: 256
    parts_num: 16
  bin_num:
  - 16
  TemporalPooling:
    type: phase
    num_phases: 8
    max_frequency_bin: 4
    spectrum_temperature: 0.25
    phase_concentration: 4.0
    mix_init: 0.5
optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  gamma: 0.1
  milestones:
  - 15000
  - 25000
  - 30000
  - 35000
  scheduler: MultiStepLR
trainer_cfg:
  find_unused_parameters: true
  enable_float16: false
  fix_BN: false
  log_iter: 100
  with_test: true
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 1000
  save_name: m1_phasepool_davis346_day40k
  sync_BN: false
  total_iter: 40000
  sampler:
    dropout: 0.0
    batch_shuffle: true
    batch_size:
    - 6
    - 4
    frames_num_fixed: 25
    frames_skip_num: 3
    frames_num_max: 40
    frames_num_min: 20
    sample_type: fixed_ordered
    type: TripletSampler
  transform:
  - type: NoOperation
  - type: NoOperation
  optimizer_reset: false
  scheduler_reset: false
